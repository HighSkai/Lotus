[workspace]
resolver = "2"
members = ["crates/lotus-core", "crates/lotus-service", "app/src-tauri"]

[workspace.package]
version = "1.0.1"
edition = "2021"
rust-version = "1.85"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/HighSkai/Lotus"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "process", "fs", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
windows-sys = "0.59"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
